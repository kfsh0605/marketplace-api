name: build

# Єдине місце, де збирається образ (build once). Усі інші воркфлоу викликають цей через workflow_call
# і далі просувають ОДИН І ТОЙ САМИЙ образ за digest, а не за тегом: тег можна перевісити, digest - хеш вмісту.
on:
  workflow_call:
    outputs:
      digest:
        description: sha256-digest зібраного образу (однорядкове значення)
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: Назва образу в GHCR без тегу
        value: ${{ jobs.build.outputs.image }}
      ref:
        description: Повне посилання образ@digest, за яким деплоїмо
        value: ${{ jobs.build.outputs.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # packages: write потрібен лише тут: GITHUB_TOKEN пушить в GHCR, жодного довгоживучого ключа реєстру немає.
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
      ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile вимагає BuildKit-секрет npm_token (required=true). Реєстр залежностей приватний лише за назвою,
      # тому справжній токен не потрібен: підставляємо файл-приманку, як і в локальній збірці.
      - name: Build secret (decoy file)
        run: printf 'ci-dummy-npm-token' > .npm_token

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          secret-files: |
            npm_token=.npm_token

      - name: Record the build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo "збірка не повернула digest" >&2; exit 1; }
          mkdir -p ci-out
          printf 'build image=%s digest=%s sha=%s run=%s\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-out/build.log
          printf 'image-ref=%s@%s\nbuilt-digest=%s\n' "$IMAGE" "$DIGEST" "$DIGEST" > ci-out/build.env

      - name: Upload build evidence part
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-build
          path: ci-out/
          if-no-files-found: ignore
