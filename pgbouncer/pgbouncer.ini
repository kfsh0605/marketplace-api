;; PgBouncer перед Postgres курсового (ДЗ №15).
;; Файл монтується у контейнер як є — edoburu/pgbouncer бачить готовий
;; /etc/pgbouncer/pgbouncer.ini і НЕ генерує конфіг з env-змінних.

[databases]
; "*" — будь-яку назву бази, яку просить клієнт (у нас "marketplace"),
; проксі підключає до Postgres під тією самою назвою.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ключова настройка цього ДЗ
pool_mode = transaction
default_pool_size = 8
max_client_conn = 120

; named prepared statements драйвера прив'язані до конкретного server connection,
; а в transaction mode клієнт після кожної транзакції може отримати ІНШИЙ
; server connection. Дозволяємо пулу тримати prepared statements per-server,
; щоб не ловити "prepared statement does not exist" (PgBouncer >= 1.21).
max_prepared_statements = 100

; node-postgres шле стартовий параметр extra_float_digits — ігноруємо його.
ignore_startup_parameters = extra_float_digits

admin_users = marketplace
stats_users = marketplace

logfile = /dev/stdout
pidfile = /tmp/pgbouncer.pid