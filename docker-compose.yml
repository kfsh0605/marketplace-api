# Спільне для API, relay і consumer: один образ, секрети монтуються з хоста (в образі їх немає).
# Профіль `app`: звичайний `docker compose up -d --wait` піднімає лише інфраструктуру, як і раніше,
# а `docker compose --profile app up -d --wait` додає ще й застосунок.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.app
  image: marketplace-api:compose
  restart: unless-stopped
  profiles: ["app"]
  volumes:
    - ./secrets:/app/secrets:ro
  environment:
    NODE_ENV: development
    DB_HOST: pgbouncer
    DB_PORT: "6432"
    DB_USER: ${DB_USER}
    DB_NAME: ${DB_NAME}
    RABBITMQ_HOST: rabbitmq
    REDIS_URL: redis://redis-cache:6379
    REDIS_QUEUE_URL: redis://redis-queue:6379
    STORAGE_ENDPOINT: http://s3:9000
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    tmpfs:
      - /tmp

  rabbitmq:
    image: rabbitmq:4.2-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-marketplace}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-n4mPz9VuTxQaRy7bGhDsLk2E}
    ports:
      - "5672:5672"     # AMQP: сюди ходять наші publish/consume
      - "15672:15672"   # веб-панель управління (для людей, не для коду)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis-cache:
    image: redis:8.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-queue:
    image: redis:8.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: [ "server", "/data", "--address", ":9000", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-hw26user}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-hw26secretpass}
    ports:
      - "127.0.0.1:22650:9000"
    tmpfs:
      - /data:size=1g

  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
      POSTGRES_DB: pact_broker
    volumes:
      - pact_broker_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:latest
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker@pact-broker-db:5432/pact_broker
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_LOG_LEVEL: WARN
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      pact-broker-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:22901:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready" ]
      interval: 5s
      timeout: 3s
      retries: 12

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:22904:16686"
      - "127.0.0.1:22918:4318"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:16686/" ]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hw29-grafana-pass}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:22902:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health" ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "3000:3000"
    # міграції, ідемпотентний seed і топологія RabbitMQ виконуються перед стартом API:
    # relay і consumer чекають на healthcheck цього сервісу, тож схема й exchange уже готові
    command:
      - bash
      - scripts/with-secrets.sh
      - dev
      - sh
      - -c
      - node_modules/.bin/typeorm migration:run -d dist/data-source.js && node dist/seed.js && node dist/messaging/setup.js && exec node dist/main.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  relay:
    <<: *app
    depends_on:
      api:
        condition: service_healthy
    command: ["bash", "scripts/with-secrets.sh", "dev", "node", "dist/outbox/run-relay.js"]

  consumer:
    <<: *app
    depends_on:
      api:
        condition: service_healthy
    command: ["bash", "scripts/with-secrets.sh", "dev", "node", "dist/messaging/run-consumer.js"]

volumes:
  pgdata:
  pact_broker_db_data:
  rabbitmq_data:
  redis_queue_data:

secrets:
  db_password:
    file: ./secrets/db_password