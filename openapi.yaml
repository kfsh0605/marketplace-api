openapi: 3.0.0
paths:
  /products:
    get:
      operationId: listProducts
      parameters:
        - name: limit
          required: false
          in: query
          description: Максимальна кількість елементів на сторінці
          schema:
            type: number
        - name: cursor
          required: false
          in: query
          description: Курсор для пагінації
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
      summary: Отримати список товарів
      tags:
        - products
    post:
      operationId: createProduct
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          description: Немає або недійсний access-токен
        '403':
          description: Роль користувача не seller і не admin
        '409':
          description: Товар з такою назвою вже існує
      security:
        - bearer: []
      summary: Створити товар (лише seller або admin)
      tags:
        - products
  /products/{productId}:
    get:
      operationId: getProduct
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            example: p-1
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      summary: Отримати товар за id
      tags:
        - products
  /products/{productId}/card:
    get:
      operationId: getProductCard
      parameters:
        - name: productId
          required: true
          in: path
          schema:
            example: '42'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
      summary: >-
        Картка товару зі статистикою продажів (cache-aside, TTL з джитером,
        single-flight)
      tags:
        - products
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: number
        - name: cursor
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Немає або недійсний access-токен
      security:
        - bearer: []
      summary: Отримати список замовлень
      tags:
        - orders
    post:
      operationId: createOrder
      parameters:
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            Унікальний ключ, який клієнт генерує самостійно для запобігання
            дублюванню замовлень при повторній відправці одного й того самого
            запиту (наприклад, при повторній спробі після таймауту мережі). Той
            самий ключ з тим самим тілом запиту поверне збережену раніше
            відповідь замість створення нового замовлення.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Немає або недійсний access-токен
      security:
        - bearer: []
      summary: Створити нове замовлення
      tags:
        - orders
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            example: o-1
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Немає або недійсний access-токен
        '404':
          description: Замовлення не існує або належить іншому користувачу
      security:
        - bearer: []
      summary: Отримати замовлення за id
      tags:
        - orders
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            example: o-1
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Немає або недійсний access-токен
        '403':
          description: Змінювати статус можуть лише seller або admin
      security:
        - bearer: []
      summary: Змінити статус замовлення
      tags:
        - orders
  /orders/{orderId}/events:
    get:
      operationId: streamOrderEvents
      parameters:
        - name: orderId
          required: true
          in: path
          schema:
            example: o-1
            type: string
        - name: last-event-id
          required: true
          in: header
          schema:
            type: string
      responses:
        '401':
          description: Немає або недійсний access-токен
        '404':
          description: Замовлення не існує або належить іншому користувачу
      security:
        - bearer: []
      summary: SSE-потік подій зміни статусу замовлення
      tags:
        - orders
  /auth/login:
    post:
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
        '401':
          description: |-
            Невірний email або пароль

            Невірний email або пароль
        '429':
          description: Забагато спроб входу з цього IP для цього email; див. Retry-After
        '503':
          description: 'Не вдалося перевірити ліміт спроб: повторіть пізніше'
      summary: Увійти за email і паролем
      tags:
        - auth
  /auth/refresh:
    post:
      operationId: refreshTokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
        '401':
          description: >-
            Refresh невідомий, використаний повторно, відкликаний або
            протермінований
      summary: Обміняти refresh-токен на нову пару (ротація)
      tags:
        - auth
  /auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '204':
          description: Сесію завершено
        '401':
          description: Немає або недійсний access-токен
        '503':
          description: 'Денілист недоступний: повторіть logout'
      security:
        - bearer: []
      summary: 'Вийти: відкликати refresh-сім''ю й access-токен'
      tags:
        - auth
  /health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '503':
          description: Базу даних недоступна
      summary: Перевірка стану застосунку та підключення до БД
      tags:
        - health
  /uploads/intent:
    post:
      operationId: createUploadIntent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntentResponse'
        '400':
          description: Тип файла поза allowlist або некоректний розмір
        '401':
          description: Немає або недійсний access-токен
      security:
        - bearer: []
      summary: 'Крок 1: отримати presigned URL, щоб покласти байти напряму у сховище'
      tags:
        - files
  /uploads/commit:
    post:
      operationId: commitUpload
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitUploadDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          description: Немає або недійсний access-токен
        '404':
          description: Файл не існує або належить іншому користувачу
        '409':
          description: >-
            Об'єкта ще немає у сховищі або його розмір не збігається із
            заявленим
      security:
        - bearer: []
      summary: >-
        Крок 3: підтвердити завантаження (сервер перевіряє об'єкт у сховищі
        через HeadObject)
      tags:
        - files
  /uploads/{fileId}/parts:
    get:
      operationId: listUploadedParts
      parameters:
        - name: fileId
          required: true
          in: path
          schema:
            example: 3f2b8a52-6f0c-4c6b-9d6e-2a9f6c1b7e10
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartsResponse'
        '401':
          description: Немає або недійсний access-токен
        '404':
          description: Файл не існує або належить іншому користувачу
        '409':
          description: Файл не очікує multipart-завантаження
      security:
        - bearer: []
      summary: >-
        Які частини multipart-завантаження вже лежать у сховищі (ListParts): за
        цим відновлюють після обриву
      tags:
        - files
  /uploads/{fileId}/parts/urls:
    post:
      operationId: presignUploadParts
      parameters:
        - name: fileId
          required: true
          in: path
          schema:
            example: 3f2b8a52-6f0c-4c6b-9d6e-2a9f6c1b7e10
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPartUrlsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUrlsResponse'
        '400':
          description: Номер частини поза діапазоном
        '401':
          description: Немає або недійсний access-токен
        '404':
          description: Файл не існує або належить іншому користувачу
        '409':
          description: Файл не очікує multipart-завантаження
      security:
        - bearer: []
      summary: Presigned PUT URL для вказаних частин (порціями, не більше 100 за запит)
      tags:
        - files
  /files/{id}:
    get:
      operationId: downloadFile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 3f2b8a52-6f0c-4c6b-9d6e-2a9f6c1b7e10
            type: string
      responses:
        '302':
          description: Редирект на короткоживучий presigned URL
        '401':
          description: Немає або недійсний access-токен
        '404':
          description: Файл не існує, ще не завершений або належить іншому користувачу
      security:
        - bearer: []
      summary: >-
        302 на свіжий presigned GET URL (дійсний 60 секунд); гард спрацьовує на
        кожен запит
      tags:
        - files
info:
  title: Marketplace API
  description: 'API для навчального курсового проєкту: товари та замовлення'
  version: 1.0.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          example: p-1
          description: Ідентифікатор товару
        name:
          type: string
          example: Клавіатура
          description: Назва товару
        priceCents:
          type: number
          example: 45000
          description: Ціна в найменших одиницях валюти (копійках)
        currency:
          type: string
          example: UAH
          description: Код валюти
      required:
        - id
        - name
        - priceCents
        - currency
    ProductListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          example: null
          nullable: true
          description: Курсор для наступної сторінки або null, якщо сторінка остання
      required:
        - items
        - next_cursor
    CreateProductDto:
      type: object
      properties:
        name:
          type: string
          example: Механічна клавіатура
        priceCents:
          type: number
          example: 249900
          description: Ціна в мінімальних одиницях валюти (копійки)
        stock:
          type: number
          example: 50
          description: Початковий залишок на складі
        currency:
          type: string
          enum:
            - UAH
            - USD
            - EUR
          default: UAH
      required:
        - name
        - priceCents
        - stock
    ProductCard:
      type: object
      properties:
        id:
          type: string
          example: '42'
          description: Ідентифікатор товару
        name:
          type: string
          example: Механічна клавіатура
          description: Назва товару
        priceCents:
          type: number
          example: 249900
          description: Ціна в копійках
        currency:
          type: string
          example: UAH
          description: Код валюти
        stock:
          type: number
          example: 50
          description: Залишок на складі (може відставати до кінця TTL кешу)
        unitsSold:
          type: number
          example: 1294
          description: Скільки штук продано
        revenueCents:
          type: number
          example: 323730600
          description: Виторг у копійках
        ordersCount:
          type: number
          example: 987
          description: У скількох замовленнях зустрічається товар
      required:
        - id
        - name
        - priceCents
        - currency
        - stock
        - unitsSold
        - revenueCents
        - ordersCount
    OrderItemDto:
      type: object
      properties:
        productId:
          type: string
          example: p-1
          description: Ідентифікатор товару
        quantity:
          type: number
          example: 2
          minimum: 1
          description: Кількість одиниць товару
      required:
        - productId
        - quantity
    Order:
      type: object
      properties:
        id:
          type: string
          example: o-1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
        totalCents:
          type: number
          example: 90000
          description: Загальна сума замовлення в копійках
        currency:
          type: string
          example: UAH
        status:
          type: string
          example: created
      required:
        - id
        - items
        - totalCents
        - currency
        - status
    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          example: null
          nullable: true
          description: Курсор для наступної сторінки або null, якщо сторінка остання
      required:
        - items
        - next_cursor
    CreateOrderDto:
      type: object
      properties:
        customerEmail:
          type: string
          example: ada@example.com
          description: Email клієнта, що оформлює замовлення
        items:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDto'
      required:
        - customerEmail
        - items
    UpdateOrderStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - created
            - pending
            - paid
            - packed
            - shipped
            - delivered
            - cancelled
          example: shipped
      required:
        - status
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: olena.kravchenko@example.com
        password:
          type: string
          example: marketplace-dev-password
      required:
        - email
        - password
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
          description: Короткоживучий JWT (ES256)
        refreshToken:
          type: string
          description: Одноразовий refresh-токен; при кожному refresh видається новий
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          example: 600
          description: Час життя access-токена в секундах
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: >-
            Непрозорий refresh-токен, виданий при логіні або попередньому
            refresh
      required:
        - refreshToken
    CreateUploadIntentDto:
      type: object
      properties:
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - application/pdf
            - application/gzip
          example: image/png
          description: >-
            MIME-тип файла. Лише з allowlist; саме цей тип клієнт обов'язаний
            надіслати в заголовку Content-Type при PUT
        size:
          type: number
          example: 204800
          description: >-
            Очікуваний розмір у байтах. Якщо вказано, commit звіряє його з
            реальним розміром у сховищі
        filename:
          type: string
          example: avatar.png
          description: >-
            Лише для довідки клієнта. Ігнорується: ключ об'єкта завжди генерує
            сервер
      required:
        - contentType
    MultipartInfo:
      type: object
      properties:
        partSize:
          type: number
          example: 5242880
          description: Розмір кожної частини, крім останньої
        partCount:
          type: number
          example: 3
      required:
        - partSize
        - partCount
    UploadIntentResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
            - single
            - multipart
          description: >-
            single: один PUT на url; multipart: частини через
            /uploads/{fileId}/parts
        fileId:
          type: string
          example: 3f2b8a52-6f0c-4c6b-9d6e-2a9f6c1b7e10
        key:
          type: string
          example: uploads/7/3f2b8a52-6f0c-4c6b-9d6e-2a9f6c1b7e10.png
        method:
          type: string
          example: PUT
          description: Лише для mode=single
        url:
          type: string
          description: >-
            Лише для mode=single: presigned URL, клієнт кладе байти напряму
            сюди, повз наш API
        headers:
          type: object
          example:
            content-type: image/png
          description: 'Лише для mode=single: заголовки, які обов''язково надіслати при PUT'
        multipart:
          description: Лише для mode=multipart
          allOf:
            - $ref: '#/components/schemas/MultipartInfo'
        expiresInSeconds:
          type: number
          example: 300
          description: 'Строк дії виданого URL (для multipart: URL однієї частини)'
      required:
        - mode
        - fileId
        - key
        - expiresInSeconds
    CommitUploadDto:
      type: object
      properties:
        fileId:
          type: string
          example: 3f2b8a52-6f0c-4c6b-9d6e-2a9f6c1b7e10
          description: fileId з відповіді intent
      required:
        - fileId
    FileResponse:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - COMPLETED
        contentType:
          type: string
          example: image/png
        size:
          type: number
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - key
        - status
        - contentType
        - size
        - completedAt
    PartInfo:
      type: object
      properties:
        partNumber:
          type: number
          example: 1
        size:
          type: number
          example: 5242880
        etag:
          type: string
          example: '"5d41402abc4b2a76b9719d911017c592"'
      required:
        - partNumber
        - size
        - etag
    PartsResponse:
      type: object
      properties:
        fileId:
          type: string
        partSize:
          type: number
          example: 5242880
        partCount:
          type: number
          example: 3
        parts:
          description: Частини, які вже лежать у сховищі (ListParts)
          type: array
          items:
            $ref: '#/components/schemas/PartInfo'
      required:
        - fileId
        - partSize
        - partCount
        - parts
    RequestPartUrlsDto:
      type: object
      properties:
        partNumbers:
          example:
            - 3
          description: >-
            Номери частин (з 1), для яких потрібні presigned URL; не більше 100
            за один запит
          type: array
          items:
            type: number
      required:
        - partNumbers
    PartUrl:
      type: object
      properties:
        partNumber:
